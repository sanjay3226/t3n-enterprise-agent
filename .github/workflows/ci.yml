name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Type check (TypeScript)
        run: npm run build

      - name: Run unit test suite
        run: npm test
        env:
          T3N_API_KEY: "0x47d89ea8b355755a17c0d32a43928b45e7082d48b1613afa16920a7a4f8e6fa3"
          T3N_TENANT_DID: "did:t3n:1142e6fe4b46cda878b5aedcc32fad8c3a979384"
          T3N_ENVIRONMENT: "testnet"
          PORT: 3000
